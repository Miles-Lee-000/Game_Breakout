<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout</title>
<style>
  :root {
    --color-background: #10121a;
    --color-hud-text: #e5e7eb;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--color-background);
    color: var(--color-hud-text);
    font-family: system-ui, sans-serif;
  }

  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100%;
    padding: 16px;
    box-sizing: border-box;
  }

  #hud {
    flex: 0 0 auto;
    width: 480px;
    max-width: 100%;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 8px 16px;
    font-size: 16px;
    margin-bottom: 12px;
  }

  #hud .stat {
    font-weight: bold;
  }

  #controls {
    display: flex;
    gap: 8px;
  }

  #controls button {
    font: inherit;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 4px;
    border: 1px solid #9ca3af;
    background: #e5e7eb;
    color: #10121a;
  }

  /* Scale-to-fit: the canvas keeps its fixed 480x720 logical drawing resolution
     (the width/height attributes below) but is CSS-scaled to fit within whatever
     space #canvas-wrap has, preserving aspect ratio. #canvas-wrap fills the
     remaining viewport height below the HUD and centers the canvas, so a
     mismatched viewport aspect ratio letterboxes rather than distorting it. */
  #canvas-wrap {
    flex: 1 1 auto;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #game {
    box-sizing: border-box;
    background: var(--color-background);
    border: 1px solid #9ca3af;
    max-width: 100%;
    max-height: 100%;
    /* Exact width/height are set by script.js via computeCanvasDisplaySize(), which
       is more reliable across browsers than relying on CSS aspect-ratio inside a
       flex container. These are just a sane pre-JS fallback. */
    width: 480px;
    height: 720px;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <span id="lives" class="stat">Lives: 3</span>
      <span id="level" class="stat">Level 1 / 3</span>
      <div id="controls">
        <button id="startBtn" type="button">Start</button>
        <button id="pauseBtn" type="button">Pause</button>
        <button id="restartBtn" type="button">Restart</button>
      </div>
    </div>
    <div id="canvas-wrap">
      <canvas id="game" width="480" height="720"></canvas>
    </div>
  </div>
  <script src="js/coords.js"></script>
  <script src="js/canvas-fit.js"></script>
  <script src="js/dt.js"></script>
  <script src="js/paddle-control.js"></script>
  <script src="js/launch.js"></script>
  <script src="js/walls.js"></script>
  <script src="js/collision-axis.js"></script>
  <script src="js/paddle-bounce.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
