<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breakout</title>
<style>
  :root {
    --color-background: #10121a;
    --color-hud-text: #e5e7eb;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--color-background);
    color: var(--color-hud-text);
    font-family: system-ui, sans-serif;
  }

  #app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100%;
    padding: 16px;
    box-sizing: border-box;
  }

  #hud {
    width: 480px;
    max-width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    font-size: 16px;
    margin-bottom: 12px;
  }

  #hud .stat {
    font-weight: bold;
  }

  #controls {
    display: flex;
    gap: 8px;
  }

  #controls button {
    font: inherit;
    padding: 6px 12px;
    cursor: pointer;
    border-radius: 4px;
    border: 1px solid #9ca3af;
    background: #e5e7eb;
    color: #10121a;
  }

  #game {
    background: var(--color-background);
    border: 1px solid #9ca3af;
    max-width: 100%;
    height: auto;
  }
</style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <span id="lives" class="stat">Lives: 3</span>
      <span id="level" class="stat">Level 1 / 3</span>
      <div id="controls">
        <button id="startBtn" type="button">Start</button>
        <button id="pauseBtn" type="button">Pause</button>
        <button id="restartBtn" type="button">Restart</button>
      </div>
    </div>
    <canvas id="game" width="480" height="720"></canvas>
  </div>
</body>
</html>
